<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="PhoneEdge storefront preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="0.55" stop-color="#3730a3"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
    <filter id="softshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1e293b" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Backdrop -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Browser window -->
  <g filter="url(#shadow)">
    <rect x="80" y="56" width="1120" height="616" rx="20" fill="#ffffff"/>
  </g>

  <!-- Browser top bar -->
  <path d="M80 76 a20 20 0 0 1 20 -20 h1080 a20 20 0 0 1 20 20 v28 h-1120 z" fill="#f1f5f9"/>
  <circle cx="112" cy="70" r="6" fill="#fb7185"/>
  <circle cx="132" cy="70" r="6" fill="#fbbf24"/>
  <circle cx="152" cy="70" r="6" fill="#34d399"/>
  <rect x="470" y="60" width="340" height="20" rx="10" fill="#e2e8f0"/>
  <text x="640" y="74" text-anchor="middle" font-size="11" fill="#94a3b8">phoneedge.app</text>

  <!-- App navbar -->
  <text x="120" y="142" font-size="26" font-weight="800" fill="#4f46e5">PhoneEdge</text>
  <text x="980" y="142" font-size="14" fill="#64748b">Need Help?</text>
  <!-- cart icon -->
  <g transform="translate(1066,124)" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 4h2l2.4 11.2a1.6 1.6 0 0 0 1.6 1.3h8.2a1.6 1.6 0 0 0 1.6-1.2L23 7H6"/>
    <circle cx="10" cy="21" r="1.4"/>
    <circle cx="19" cy="21" r="1.4"/>
  </g>
  <rect x="1100" y="120" width="80" height="36" rx="12" fill="#4f46e5"/>
  <text x="1140" y="143" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Sign In</text>
  <line x1="120" y1="170" x2="1160" y2="170" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Hero banner -->
  <g filter="url(#softshadow)">
    <rect x="120" y="194" width="1040" height="250" rx="24" fill="url(#hero)"/>
  </g>
  <!-- decorative product glow -->
  <circle cx="1010" cy="319" r="120" fill="#ffffff" opacity="0.06"/>
  <g transform="translate(950,232)">
    <rect x="0" y="0" width="120" height="174" rx="22" fill="url(#phone)"/>
    <rect x="10" y="10" width="100" height="154" rx="14" fill="#1e1b4b" opacity="0.55"/>
    <circle cx="60" cy="24" r="3" fill="#c7d2fe"/>
  </g>

  <rect x="160" y="226" width="150" height="26" rx="13" fill="#f59e0b"/>
  <text x="235" y="244" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1">NEW SEASON DROP</text>

  <text x="160" y="300" font-size="40" font-weight="800" fill="#ffffff">Premium accessories</text>
  <text x="160" y="346" font-size="40" font-weight="800" fill="#ffffff">for every phone</text>
  <text x="160" y="382" font-size="15" fill="#e0e7ff">Cases, chargers and audio — built to last.</text>

  <rect x="160" y="398" width="150" height="40" rx="13" fill="#f59e0b"/>
  <text x="235" y="423" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Shop Now</text>

  <!-- Section heading -->
  <text x="120" y="492" font-size="20" font-weight="700" fill="#0f172a">Featured Products</text>
  <text x="1108" y="492" text-anchor="end" font-size="13" fill="#64748b">Sort  v</text>

  <!-- Product cards -->
  <g>
    <!-- card template repeated -->
    <g transform="translate(120,512)">
      <rect width="244" height="150" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="0" y="0" width="244" height="84" rx="16" fill="#f1f5f9"/>
      <circle cx="122" cy="42" r="28" fill="#c7d2fe"/>
      <rect x="200" y="12" width="34" height="18" rx="9" fill="#f59e0b"/>
      <text x="217" y="25" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">-20%</text>
      <rect x="16" y="98" width="120" height="10" rx="5" fill="#334155"/>
      <rect x="16" y="116" width="80" height="8" rx="4" fill="#cbd5e1"/>
      <text x="16" y="142" font-size="15" font-weight="800" fill="#0f172a">$39</text>
      <rect x="150" y="128" width="78" height="22" rx="9" fill="#4f46e5"/>
      <text x="189" y="143" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">Add to cart</text>
    </g>
    <g transform="translate(384,512)">
      <rect width="244" height="150" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="0" y="0" width="244" height="84" rx="16" fill="#f1f5f9"/>
      <circle cx="122" cy="42" r="28" fill="#bbf7d0"/>
      <rect x="16" y="98" width="120" height="10" rx="5" fill="#334155"/>
      <rect x="16" y="116" width="80" height="8" rx="4" fill="#cbd5e1"/>
      <text x="16" y="142" font-size="15" font-weight="800" fill="#0f172a">$24</text>
      <rect x="150" y="128" width="78" height="22" rx="9" fill="#4f46e5"/>
      <text x="189" y="143" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">Add to cart</text>
    </g>
    <g transform="translate(648,512)">
      <rect width="244" height="150" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="0" y="0" width="244" height="84" rx="16" fill="#f1f5f9"/>
      <circle cx="122" cy="42" r="28" fill="#fed7aa"/>
      <rect x="200" y="12" width="34" height="18" rx="9" fill="#f59e0b"/>
      <text x="217" y="25" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">-15%</text>
      <rect x="16" y="98" width="120" height="10" rx="5" fill="#334155"/>
      <rect x="16" y="116" width="80" height="8" rx="4" fill="#cbd5e1"/>
      <text x="16" y="142" font-size="15" font-weight="800" fill="#0f172a">$58</text>
      <rect x="150" y="128" width="78" height="22" rx="9" fill="#4f46e5"/>
      <text x="189" y="143" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">Add to cart</text>
    </g>
    <g transform="translate(912,512)">
      <rect width="244" height="150" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="0" y="0" width="244" height="84" rx="16" fill="#f1f5f9"/>
      <circle cx="122" cy="42" r="28" fill="#fecdd3"/>
      <rect x="16" y="98" width="120" height="10" rx="5" fill="#334155"/>
      <rect x="16" y="116" width="80" height="8" rx="4" fill="#cbd5e1"/>
      <text x="16" y="142" font-size="15" font-weight="800" fill="#0f172a">$72</text>
      <rect x="150" y="128" width="78" height="22" rx="9" fill="#4f46e5"/>
      <text x="189" y="143" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">Add to cart</text>
    </g>
  </g>
</svg>
