<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="PhoneEdge">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <!-- rounded app-icon background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- phone body -->
  <rect x="10" y="6" width="12" height="20" rx="3" fill="#ffffff"/>
  <!-- screen -->
  <rect x="11.5" y="8.5" width="9" height="13" rx="1.5" fill="#312e81"/>
  <!-- home indicator -->
  <rect x="14" y="23" width="4" height="1.4" rx="0.7" fill="#c7d2fe"/>
  <!-- amber accent bolt -->
  <path d="M17.4 10.2l-4 5.2h2.6l-1 4.4 4-5.4h-2.7z" fill="#f59e0b"/>
</svg>
